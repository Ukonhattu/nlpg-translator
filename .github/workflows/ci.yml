name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

  integration:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.AALTO_API_KEY != '' }}
    steps:
      - name: Skip when no API key
        if: env.HAS_KEY != 'true'
        run: echo "AALTO_API_KEY not set; skipping integration tests"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        if: env.HAS_KEY == 'true'
      - run: npm run build
        if: env.HAS_KEY == 'true'
      - run: npm run test:integration
        if: env.HAS_KEY == 'true'
        env:
          AALTO_API_KEY: ${{ secrets.AALTO_API_KEY }}
          AALTO_ENDPOINT: ${{ secrets.AALTO_ENDPOINT }}
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          LLM_GATEWAY_RESPONSES_ENDPOINT: ${{ secrets.LLM_GATEWAY_RESPONSES_ENDPOINT }}
          LLM_GATEWAY_MODEL: ${{ secrets.LLM_GATEWAY_MODEL }}
